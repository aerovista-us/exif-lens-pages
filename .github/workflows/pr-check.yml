name: EXIF Lens PR Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test local metadata engine
        run: npm run test:local
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://workspaces.aerocoreos.com/exif-api
